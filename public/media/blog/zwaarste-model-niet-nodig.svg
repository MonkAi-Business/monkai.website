<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Een stroom vragen die via een klein groen knooppunt verdeeld wordt over drie blokken van verschillende grootte">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <rect width="1200" height="800" fill="#F4F2EC"/>
  <g transform="translate(55 14)">
  <!-- vragen links -->
  <g fill="#FBFAF6" stroke="#D9DACE" stroke-width="3">
    <rect x="120" y="250" width="150" height="56" rx="8"/>
    <rect x="120" y="322" width="150" height="56" rx="8"/>
    <rect x="120" y="394" width="150" height="56" rx="8"/>
    <rect x="120" y="466" width="150" height="56" rx="8"/>
  </g>
  <g stroke="#656A5C" stroke-width="6" stroke-linecap="round">
    <line x1="142" y1="278" x2="230" y2="278"/>
    <line x1="142" y1="350" x2="210" y2="350"/>
    <line x1="142" y1="422" x2="240" y2="422"/>
    <line x1="142" y1="494" x2="200" y2="494"/>
  </g>
  <!-- naar de portier -->
  <g stroke="#656A5C" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M270 278 C 380 278, 420 386, 500 386"/>
    <path d="M270 350 C 380 350, 420 386, 500 386"/>
    <path d="M270 422 C 380 422, 420 386, 500 386"/>
    <path d="M270 494 C 380 494, 420 386, 500 386"/>
  </g>
  <!-- portier -->
  <circle cx="540" cy="386" r="44" fill="#4C5F3B"/>
  <circle cx="540" cy="386" r="16" fill="#F4F2EC"/>
  <!-- uitgangen -->
  <path d="M584 386 C 680 386, 700 300, 790 300" stroke="#4C5F3B" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M584 386 C 680 386, 700 420, 790 420" stroke="#8FA478" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M584 386 C 680 386, 700 548, 790 548" stroke="#8FA478" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 14"/>
  <!-- drie modellen, klein tot groot -->
  <rect x="800" y="262" width="76" height="76" rx="10" fill="#4C5F3B"/>
  <rect x="800" y="374" width="110" height="92" rx="10" fill="#FBFAF6" stroke="#8FA478" stroke-width="5"/>
  <rect x="800" y="496" width="170" height="110" rx="10" fill="#FBFAF6" stroke="#D9DACE" stroke-width="5"/>
  <g font-family="ui-monospace, 'Courier New', monospace" font-size="26" font-weight="700" text-anchor="middle">
    <text x="838" y="310" fill="#F4F2EC">H</text>
    <text x="855" y="430" fill="#4C5F3B">S</text>
    <text x="885" y="561" fill="#656A5C">O</text>
  </g>
  </g>
</svg>
