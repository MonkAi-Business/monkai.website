<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Eén sjabloonkaart die drie keer herhaald wordt, binnen een begrensd kader">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- de hekken: alles speelt zich binnen dit kader af -->
  <rect x="155" y="205" width="1000" height="390" rx="22" fill="none" stroke="#4C5F3B" stroke-width="2.5" stroke-dasharray="9 13"/>

  <!-- het sjabloon: de gedeelde prompt -->
  <rect x="215" y="250" width="215" height="300" rx="10" fill="#37472A"/>
  <rect x="245" y="288" width="120" height="11" rx="5.5" fill="#8FA478"/>
  <rect x="245" y="326" width="155" height="11" rx="5.5" fill="#C9CBBF"/>
  <rect x="245" y="364" width="135" height="11" rx="5.5" fill="#C9CBBF"/>
  <rect x="245" y="402" width="155" height="11" rx="5.5" fill="#C9CBBF"/>
  <rect x="245" y="440" width="98" height="11" rx="5.5" fill="#C9CBBF"/>
  <rect x="245" y="490" width="70" height="11" rx="5.5" fill="#8FA478"/>

  <!-- de afdruk gaat naar rechts -->
  <path d="M462 400 l22 0 M478 392 l10 8 -10 8" fill="none" stroke="#4C5F3B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- drie keer opnieuw toegepast -->
  <g opacity="1">
    <rect x="516" y="265" width="185" height="270" rx="10" fill="#FBFAF6" stroke="#4C5F3B" stroke-width="2.5"/>
    <rect x="544" y="300" width="104" height="9" rx="4.5" fill="#4C5F3B"/>
    <rect x="544" y="334" width="130" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="544" y="368" width="112" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="544" y="402" width="130" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="544" y="452" width="60" height="9" rx="4.5" fill="#4C5F3B"/>
  </g>
  <g opacity="0.72">
    <rect x="726" y="265" width="185" height="270" rx="10" fill="#FBFAF6" stroke="#4C5F3B" stroke-width="2.5"/>
    <rect x="754" y="300" width="104" height="9" rx="4.5" fill="#4C5F3B"/>
    <rect x="754" y="334" width="130" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="754" y="368" width="112" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="754" y="402" width="130" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="754" y="452" width="60" height="9" rx="4.5" fill="#4C5F3B"/>
  </g>
  <g opacity="0.44">
    <rect x="936" y="265" width="185" height="270" rx="10" fill="#FBFAF6" stroke="#4C5F3B" stroke-width="2.5"/>
    <rect x="964" y="300" width="104" height="9" rx="4.5" fill="#4C5F3B"/>
    <rect x="964" y="334" width="130" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="964" y="368" width="112" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="964" y="402" width="130" height="9" rx="4.5" fill="#8FA478"/>
    <rect x="964" y="452" width="60" height="9" rx="4.5" fill="#4C5F3B"/>
  </g>
</svg>
