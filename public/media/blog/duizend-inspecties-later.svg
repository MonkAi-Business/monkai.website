<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Links een stapel gesloten rapporten, rechts dezelfde vaststellingen als punten op een asset">
  <rect width="1200" height="800" fill="#F4F2EC"/>

  <!-- LINKS: stapel gesloten rapporten -->
  <g transform="translate(150 230)">
    <g transform="rotate(-6 120 150)">
      <rect x="18" y="18" width="240" height="300" rx="6" fill="#E9EADF" stroke="#D9DACE" stroke-width="2"/>
    </g>
    <g transform="rotate(-3 120 150)">
      <rect x="9" y="9" width="240" height="300" rx="6" fill="#EFEDE5" stroke="#D9DACE" stroke-width="2"/>
    </g>
    <rect x="0" y="0" width="240" height="300" rx="6" fill="#FBFAF6" stroke="#D9DACE" stroke-width="2"/>
    <g fill="#D9DACE">
      <rect x="28" y="40" width="126" height="12" rx="4"/>
      <rect x="28" y="82" width="184" height="9" rx="4"/>
      <rect x="28" y="106" width="184" height="9" rx="4"/>
      <rect x="28" y="130" width="150" height="9" rx="4"/>
      <rect x="28" y="168" width="184" height="9" rx="4"/>
      <rect x="28" y="192" width="164" height="9" rx="4"/>
      <rect x="28" y="216" width="184" height="9" rx="4"/>
      <rect x="28" y="240" width="112" height="9" rx="4"/>
    </g>
    <text x="126" y="356" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#656A5C">duizend rapporten,</text>
    <text x="126" y="388" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#656A5C">geen antwoord</text>
  </g>

  <!-- PIJL -->
  <g stroke="#4C5F3B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M452 380 H556"/>
    <path d="M540 364 L558 380 L540 396"/>
  </g>

  <!-- RECHTS: asset met vaststellingen -->
  <g transform="translate(600 210)">
    <rect x="0" y="0" width="470" height="340" rx="8" fill="#FBFAF6" stroke="#D9DACE" stroke-width="2"/>

    <!-- vereenvoudigd voertuig als asset -->
    <g stroke="#24261F" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M62 186 V104 h196 v-40 h74 l52 60 v62 z"/>
      <path d="M258 104 h74 l52 60 h-126 z" stroke-width="3"/>
      <circle cx="132" cy="190" r="26"/>
      <circle cx="330" cy="190" r="26"/>
    </g>

    <!-- vaststellingen als aanklikbare punten -->
    <g font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle">
      <circle cx="132" cy="190" r="17" fill="#4C5F3B"/>
      <text x="132" y="197" fill="#FBFAF6">1</text>
      <circle cx="330" cy="190" r="17" fill="#4C5F3B"/>
      <text x="330" y="197" fill="#FBFAF6">2</text>
      <circle cx="356" cy="128" r="17" fill="#8FA478"/>
      <text x="356" y="135" fill="#24261F">3</text>
      <circle cx="150" cy="128" r="17" fill="#8FA478"/>
      <text x="150" y="135" fill="#24261F">4</text>
    </g>

    <!-- meetbare uitkomst -->
    <g transform="translate(0 236)">
      <rect x="34" y="0" width="402" height="1.5" fill="#D9DACE"/>
      <g fill="#4C5F3B">
        <rect x="34" y="22" width="206" height="11" rx="5.5"/>
        <rect x="34" y="46" width="136" height="11" rx="5.5"/>
      </g>
      <rect x="34" y="70" width="74" height="11" rx="5.5" fill="#8FA478"/>
      <g font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#656A5C">
        <text x="254" y="33">remmen</text>
        <text x="184" y="57">banden</text>
        <text x="122" y="81">verlichting</text>
      </g>
    </g>
  </g>

  <text x="835" y="606" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#656A5C">elke vaststelling een veld,</text>
  <text x="835" y="638" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#656A5C">geen zin in een pdf</text>
</svg>
