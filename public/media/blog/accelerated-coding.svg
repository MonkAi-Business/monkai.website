<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Links code die niemand meer bekijkt, rechts dezelfde code met snelheidslijnen en een vinkje">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- links: code die niemand nog bekijkt -->
  <rect x="140" y="240" width="400" height="320" rx="16" fill="#24261F"/>
  <rect x="190" y="296" width="250" height="14" rx="7" fill="#4A4E42"/>
  <rect x="190" y="336" width="310" height="14" rx="7" fill="#4A4E42"/>
  <rect x="190" y="376" width="200" height="14" rx="7" fill="#4A4E42"/>
  <rect x="190" y="416" width="280" height="14" rx="7" fill="#4A4E42"/>

  <!-- gesloten oog -->
  <path d="M296 492 q44 34 88 0" fill="none" stroke="#A9AC9C" stroke-width="5" stroke-linecap="round"/>
  <line x1="308" y1="506" x2="300" y2="518" stroke="#A9AC9C" stroke-width="5" stroke-linecap="round"/>
  <line x1="340" y1="516" x2="340" y2="530" stroke="#A9AC9C" stroke-width="5" stroke-linecap="round"/>
  <line x1="372" y1="506" x2="380" y2="518" stroke="#A9AC9C" stroke-width="5" stroke-linecap="round"/>

  <!-- scheiding tussen de twee manieren van werken -->
  <line x1="600" y1="200" x2="600" y2="600" stroke="#C7C8BC" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 16"/>

  <!-- rechts: dezelfde code, wel gelezen en veel sneller -->
  <rect x="660" y="240" width="400" height="320" rx="16" fill="#FBFAF6" stroke="#D9DACE" stroke-width="2"/>

  <rect x="674" y="296" width="18" height="14" rx="7" fill="#C3CFB2"/>
  <rect x="700" y="296" width="24" height="14" rx="7" fill="#8FA478"/>
  <rect x="730" y="296" width="250" height="14" rx="7" fill="#24261F"/>

  <rect x="674" y="336" width="18" height="14" rx="7" fill="#C3CFB2"/>
  <rect x="700" y="336" width="24" height="14" rx="7" fill="#8FA478"/>
  <rect x="730" y="336" width="310" height="14" rx="7" fill="#4C5F3B"/>

  <rect x="674" y="376" width="18" height="14" rx="7" fill="#C3CFB2"/>
  <rect x="700" y="376" width="24" height="14" rx="7" fill="#8FA478"/>
  <rect x="730" y="376" width="200" height="14" rx="7" fill="#24261F"/>

  <rect x="674" y="416" width="18" height="14" rx="7" fill="#C3CFB2"/>
  <rect x="700" y="416" width="24" height="14" rx="7" fill="#8FA478"/>
  <rect x="730" y="416" width="280" height="14" rx="7" fill="#4C5F3B"/>

  <!-- nagekeken -->
  <circle cx="990" cy="496" r="32" fill="#4C5F3B"/>
  <path d="M976 496 l10 11 l18 -22" fill="none" stroke="#F4F2EC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
