<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Oplopende verbruiksbalken die door een gestreept budgetplafond breken, boven een vaste sokkel">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- vaste sokkel: de licentie die je sowieso betaalt -->
  <rect x="330" y="560" width="540" height="26" rx="6" fill="#8FA478"/>

  <!-- budgetplafond -->
  <line x1="330" y1="300" x2="870" y2="300" stroke="#4C5F3B" stroke-width="2.5" stroke-dasharray="9 13"/>

  <!-- oplopend verbruik: laatste balken breken door het plafond -->
  <rect x="360" y="470" width="52" height="90"  rx="5" fill="#4C5F3B" opacity="0.55"/>
  <rect x="440" y="430" width="52" height="130" rx="5" fill="#4C5F3B" opacity="0.62"/>
  <rect x="520" y="360" width="52" height="200" rx="5" fill="#4C5F3B" opacity="0.72"/>
  <rect x="600" y="300" width="52" height="260" rx="5" fill="#4C5F3B" opacity="0.82"/>
  <rect x="680" y="235" width="52" height="325" rx="5" fill="#37472A"/>
  <rect x="760" y="180" width="52" height="380" rx="5" fill="#37472A"/>

  <!-- verbruik dat verder 'ontsnapt' voorbij de laatste balk -->
  <circle cx="852" cy="150" r="9" fill="#4C5F3B" opacity="0.7"/>
  <circle cx="892" cy="120" r="6" fill="#4C5F3B" opacity="0.5"/>
</svg>
