<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Een vlakke prijslijn die plots omhoog springt, met een tweede pad dat vlak blijft doorlopen">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- grondlijn -->
  <line x1="200" y1="600" x2="1000" y2="600" stroke="#4C5F3B" stroke-width="2" opacity="0.25"/>

  <!-- rasterlijnen: prijsniveaus -->
  <line x1="200" y1="500" x2="1000" y2="500" stroke="#37472A" stroke-width="1" opacity="0.10"/>
  <line x1="200" y1="400" x2="1000" y2="400" stroke="#37472A" stroke-width="1" opacity="0.10"/>
  <line x1="200" y1="300" x2="1000" y2="300" stroke="#37472A" stroke-width="1" opacity="0.10"/>

  <!-- de gesponsorde prijs: vlak, laag, tot het kantelpunt -->
  <path d="M 200 500 L 600 500" fill="none" stroke="#4C5F3B" stroke-width="6" stroke-linecap="round"/>

  <!-- de sprong: verbruiksfacturatie -->
  <path d="M 600 500 L 600 280 L 1000 280" fill="none" stroke="#4C5F3B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- het alternatief: blijft vlak doorlopen -->
  <path d="M 600 500 L 1000 512" fill="none" stroke="#8FA478" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 16"/>

  <!-- kantelpunt: hier maak je de keuze -->
  <circle cx="600" cy="500" r="16" fill="#EDEBE3" stroke="#4C5F3B" stroke-width="6"/>

  <!-- tokens die de lijn voeden -->
  <rect x="252" y="556" width="18" height="18" rx="3" fill="#8FA478" opacity="0.55"/>
  <rect x="300" y="556" width="18" height="18" rx="3" fill="#8FA478" opacity="0.5"/>
  <rect x="348" y="556" width="18" height="18" rx="3" fill="#8FA478" opacity="0.45"/>
  <rect x="700" y="556" width="18" height="18" rx="3" fill="#6E855A" opacity="0.8"/>
  <rect x="736" y="556" width="18" height="18" rx="3" fill="#6E855A" opacity="0.75"/>
  <rect x="772" y="556" width="18" height="18" rx="3" fill="#6E855A" opacity="0.7"/>
  <rect x="808" y="556" width="18" height="18" rx="3" fill="#6E855A" opacity="0.65"/>
  <rect x="844" y="556" width="18" height="18" rx="3" fill="#6E855A" opacity="0.6"/>
  <rect x="880" y="556" width="18" height="18" rx="3" fill="#6E855A" opacity="0.55"/>
  <rect x="916" y="556" width="18" height="18" rx="3" fill="#6E855A" opacity="0.5"/>
</svg>
