<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Losse notities die samenkomen in één map">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- drijvende notities die naar de map zakken -->
  <g transform="rotate(-9 540 250)">
    <rect x="490" y="212" width="100" height="76" rx="8" fill="#F4F2EC" stroke="#D9DACE" stroke-width="2"/>
    <line x1="506" y1="238" x2="574" y2="238" stroke="#A5A79C" stroke-width="2"/>
    <line x1="506" y1="258" x2="552" y2="258" stroke="#A5A79C" stroke-width="2"/>
  </g>
  <g transform="rotate(8 690 236)">
    <rect x="640" y="198" width="100" height="76" rx="8" fill="#F4F2EC" stroke="#D9DACE" stroke-width="2"/>
    <line x1="656" y1="224" x2="724" y2="224" stroke="#A5A79C" stroke-width="2"/>
    <line x1="656" y1="244" x2="708" y2="244" stroke="#A5A79C" stroke-width="2"/>
  </g>
  <g transform="rotate(-3 610 306)">
    <rect x="560" y="268" width="100" height="76" rx="8" fill="#F4F2EC" stroke="#D9DACE" stroke-width="2"/>
    <line x1="576" y1="294" x2="644" y2="294" stroke="#A5A79C" stroke-width="2"/>
    <line x1="576" y1="314" x2="626" y2="314" stroke="#A5A79C" stroke-width="2"/>
  </g>

  <!-- de ene map -->
  <rect x="452" y="356" width="150" height="40" rx="10" fill="#37472A"/>
  <rect x="440" y="384" width="320" height="206" rx="16" fill="#4C5F3B"/>
</svg>
