<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Een tijdlijn waarop elke vrijdag een nieuw artikel verschijnt">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- de weken lopen door -->
  <line x1="150" y1="480" x2="1050" y2="480" stroke="#D9DACE" stroke-width="3" stroke-linecap="round"/>

  <!-- gewone weekdagen -->
  <g stroke="#C7C8BC" stroke-width="2" stroke-linecap="round">
    <line x1="156" y1="472" x2="156" y2="488"/>
    <line x1="204" y1="472" x2="204" y2="488"/>
    <line x1="252" y1="472" x2="252" y2="488"/>
    <line x1="348" y1="472" x2="348" y2="488"/>
    <line x1="396" y1="472" x2="396" y2="488"/>
    <line x1="444" y1="472" x2="444" y2="488"/>
    <line x1="492" y1="472" x2="492" y2="488"/>
    <line x1="588" y1="472" x2="588" y2="488"/>
    <line x1="636" y1="472" x2="636" y2="488"/>
    <line x1="684" y1="472" x2="684" y2="488"/>
    <line x1="732" y1="472" x2="732" y2="488"/>
    <line x1="828" y1="472" x2="828" y2="488"/>
    <line x1="876" y1="472" x2="876" y2="488"/>
    <line x1="924" y1="472" x2="924" y2="488"/>
    <line x1="972" y1="472" x2="972" y2="488"/>
  </g>

  <!-- verbinding tussen elke vrijdag en het artikel dat er verschijnt -->
  <g stroke="#4C5F3B" stroke-width="2" stroke-linecap="round">
    <line x1="300" y1="467" x2="300" y2="410"/>
    <line x1="540" y1="467" x2="540" y2="410"/>
    <line x1="780" y1="467" x2="780" y2="410"/>
  </g>

  <!-- artikel van week één -->
  <rect x="225" y="298" width="150" height="112" rx="10" fill="#F4F2EC" stroke="#D9DACE" stroke-width="2"/>
  <rect x="243" y="318" width="44" height="8" rx="4" fill="#8FA478"/>
  <g stroke="#A5A79C" stroke-width="3" stroke-linecap="round">
    <line x1="243" y1="342" x2="357" y2="342"/>
    <line x1="243" y1="360" x2="357" y2="360"/>
    <line x1="243" y1="378" x2="319" y2="378"/>
  </g>

  <!-- artikel van week twee -->
  <rect x="465" y="298" width="150" height="112" rx="10" fill="#F4F2EC" stroke="#D9DACE" stroke-width="2"/>
  <rect x="483" y="318" width="44" height="8" rx="4" fill="#8FA478"/>
  <g stroke="#A5A79C" stroke-width="3" stroke-linecap="round">
    <line x1="483" y1="342" x2="597" y2="342"/>
    <line x1="483" y1="360" x2="597" y2="360"/>
    <line x1="483" y1="378" x2="559" y2="378"/>
  </g>

  <!-- het nieuwste artikel -->
  <rect x="705" y="298" width="150" height="112" rx="10" fill="#4C5F3B"/>
  <rect x="723" y="318" width="44" height="8" rx="4" fill="#8FA478"/>
  <g stroke="#C9CBBF" stroke-width="3" stroke-linecap="round">
    <line x1="723" y1="342" x2="837" y2="342"/>
    <line x1="723" y1="360" x2="837" y2="360"/>
    <line x1="723" y1="378" x2="799" y2="378"/>
  </g>

  <!-- de vrijdagen -->
  <circle cx="300" cy="480" r="13" fill="#4C5F3B"/>
  <circle cx="540" cy="480" r="13" fill="#4C5F3B"/>
  <circle cx="780" cy="480" r="13" fill="#4C5F3B"/>

  <!-- en de vrijdag die eraan komt -->
  <circle cx="1020" cy="480" r="13" fill="#EDEBE3" stroke="#4C5F3B" stroke-width="3" stroke-dasharray="5 6"/>
</svg>
