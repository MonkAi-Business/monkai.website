<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Verbonden knooppunten rond een centraal punt als gedeeld bedrijfsgeheugen">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- ring tussen de knooppunten -->
  <g stroke="#8FA478" stroke-width="2" fill="none">
    <polygon points="810,400 705,218 495,218 390,400 495,582 705,582"/>
  </g>
  <!-- spaken naar het centrum -->
  <g stroke="#4C5F3B" stroke-width="2" opacity="0.38">
    <line x1="600" y1="400" x2="810" y2="400"/>
    <line x1="600" y1="400" x2="705" y2="218"/>
    <line x1="600" y1="400" x2="495" y2="218"/>
    <line x1="600" y1="400" x2="390" y2="400"/>
    <line x1="600" y1="400" x2="495" y2="582"/>
    <line x1="600" y1="400" x2="705" y2="582"/>
  </g>

  <!-- knooppunten -->
  <circle cx="810" cy="400" r="28" fill="#4C5F3B"/>
  <circle cx="705" cy="218" r="26" fill="#8FA478"/>
  <circle cx="495" cy="218" r="26" fill="#4C5F3B"/>
  <circle cx="390" cy="400" r="28" fill="#8FA478"/>
  <circle cx="495" cy="582" r="26" fill="#4C5F3B"/>
  <circle cx="705" cy="582" r="26" fill="#8FA478"/>

  <!-- centraal knooppunt -->
  <circle cx="600" cy="400" r="46" fill="#4C5F3B"/>
  <circle cx="600" cy="400" r="20" fill="#8FA478"/>
</svg>
