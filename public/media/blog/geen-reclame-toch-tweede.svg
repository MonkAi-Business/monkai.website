<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Een lijstje van vijf met de tweede regel opgelicht, en een lege meter ernaast">
  <rect width="1200" height="800" fill="#F4F2EC"/>

  <!-- het lijstje van vijf -->
  <rect x="110" y="170" width="640" height="460" rx="10" fill="#FBFAF6" stroke="#D9DACE" stroke-width="2"/>

  <!-- 1 -->
  <text x="160" y="253" font-family="ui-monospace, 'Courier New', monospace" font-size="26" fill="#A5A79C">1</text>
  <rect x="205" y="230" width="420" height="28" rx="14" fill="#E9EADF"/>

  <!-- 2, dat zijn wij -->
  <rect x="130" y="298" width="600" height="72" rx="8" fill="#EFEDE5"/>
  <text x="160" y="345" font-family="ui-monospace, 'Courier New', monospace" font-size="30" font-weight="700" fill="#4C5F3B">2</text>
  <rect x="205" y="318" width="330" height="32" rx="16" fill="#4C5F3B"/>
  <circle cx="576" cy="334" r="19" fill="#8FA478"/>
  <path d="M567 334l7 7 13-14" fill="none" stroke="#FBFAF6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3 -->
  <text x="160" y="433" font-family="ui-monospace, 'Courier New', monospace" font-size="26" fill="#A5A79C">3</text>
  <rect x="205" y="410" width="470" height="28" rx="14" fill="#E9EADF"/>

  <!-- 4 -->
  <text x="160" y="513" font-family="ui-monospace, 'Courier New', monospace" font-size="26" fill="#A5A79C">4</text>
  <rect x="205" y="490" width="380" height="28" rx="14" fill="#E9EADF"/>

  <!-- 5 -->
  <text x="160" y="593" font-family="ui-monospace, 'Courier New', monospace" font-size="26" fill="#A5A79C">5</text>
  <rect x="205" y="570" width="440" height="28" rx="14" fill="#E9EADF"/>

  <!-- de meting die er niet stond -->
  <rect x="830" y="170" width="260" height="460" rx="10" fill="none" stroke="#D9DACE" stroke-width="2" stroke-dasharray="10 9"/>
  <line x1="880" y1="240" x2="880" y2="540" stroke="#D9DACE" stroke-width="3" stroke-linecap="round"/>
  <line x1="880" y1="540" x2="1040" y2="540" stroke="#D9DACE" stroke-width="3" stroke-linecap="round"/>
  <line x1="890" y1="540" x2="1035" y2="540" stroke="#A5A79C" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 12"/>
  <text x="960" y="415" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="130" font-weight="600" fill="#A5A79C">?</text>
</svg>
