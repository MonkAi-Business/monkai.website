<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Gelaagde risicopiramide met vier niveaus, donkerste bovenaan">
  <!-- Brand-kleuren staan hier hardcoded: een via <img> geladen SVG erft geen CSS-variabelen uit tokens.css. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEBE3"/>
      <stop offset="1" stop-color="#E4E2D9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- vier risiconiveaus: donker (hoog risico) bovenaan, licht (minimaal) onderaan -->
  <rect x="510" y="240" width="180" height="68" rx="8" fill="#37472A"/>
  <rect x="470" y="324" width="260" height="68" rx="8" fill="#4C5F3B"/>
  <rect x="430" y="408" width="340" height="68" rx="8" fill="#647A4C"/>
  <rect x="390" y="492" width="420" height="68" rx="8" fill="#8FA478"/>

  <!-- zijgeleider met tickmarkeringen -->
  <line x1="340" y1="240" x2="340" y2="560" stroke="#C9CBBF" stroke-width="2"/>
  <line x1="332" y1="274" x2="348" y2="274" stroke="#656A5C" stroke-width="2"/>
  <line x1="332" y1="358" x2="348" y2="358" stroke="#656A5C" stroke-width="2"/>
  <line x1="332" y1="442" x2="348" y2="442" stroke="#656A5C" stroke-width="2"/>
  <line x1="332" y1="526" x2="348" y2="526" stroke="#656A5C" stroke-width="2"/>
</svg>
